version: "3.7"
services:
  api:
    image: ghcr.io/jagchat/demo-rest-api-node-js-prod:latest
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:test@db:5432/demo
      - PORT=3000
    depends_on:
      - db

  db:
    image: ghcr.io/jagchat/demo-rest-api-ops-db-prod:latest
    environment:
      - POSTGRES_PASSWORD=test
    ports:
      - "6432:5432"
